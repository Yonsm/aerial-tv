<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>升级 Aerial · Update Aerial</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Opened from the QR code on the TV's update page (Control Center → New Version). The TV puts
     its version, flavor and LAN address after the #, which the browser never sends here. -->
<style>
  :root { --bg: #000; --card: #1c1c1e; --line: rgba(255,255,255,.1); --text: #f5f5f7; --muted: #a1a1a6; --accent: #2997ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px calc(40px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 0; }
  .sub { color: var(--muted); margin: 6px 0 22px; font-size: 15px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 26px 4px 8px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; }
  .card p { margin: 0 0 10px; }
  .card p:last-child { margin-bottom: 0; }
  pre {
    margin: 0; padding: 12px; border-radius: 10px; background: #000; border: 1px solid var(--line);
    font: 13px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all;
  }
  button {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; transition: transform .16s ease-out;
  }
  button:active { transform: scale(.98); }
  .agents { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0 0 12px; }
  .agents li { display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 7px; border: 1px solid var(--line); border-radius: 980px; font-size: 14px; line-height: 1.3; }
  .agents img { width: 18px; height: 18px; flex: none; }
  .note { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
  .lang { margin-left: auto; color: var(--muted); font-size: 14px; background: none; border: 0; width: auto; padding: 0; margin-top: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd0a5"/><stop offset="1" stop-color="#5b5bf0"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M7 21c3-6 6-9 9-9s6 3 9 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1 data-t="title"></h1>
    <button class="lang" id="lang"></button>
  </header>
  <p class="sub" id="sub"></p>

  <h2 data-t="aiHead"></h2>
  <div class="card">
    <p data-t="aiBody"></p>
    <ul class="agents" id="agents"></ul>
    <pre id="ai"></pre>
    <button data-copy="ai" data-t="copy"></button>
  </div>

  <h2 data-t="tvHead"></h2>
  <div class="card"><p data-t="tvBody"></p></div>

  <h2 data-t="pcHead"></h2>
  <div class="card">
    <p data-t="pcBody"></p>
    <pre id="cmd"></pre>
    <button data-copy="cmd" data-t="copy"></button>
    <p class="note" data-t="pcNote" style="margin-top:10px"></p>
  </div>

  <p class="note" data-t="keeps" style="margin:22px 4px 0"></p>
  <p class="note" style="margin:8px 4px 0"><a href="https://github.com/Yonsm/aerial-tv/releases/latest" data-t="notes"></a></p>
</main>
<script>
const T = {
  zh: {
    title: '升级 Aerial', lang: 'English',
    sub: v => v ? `电视上现在是 Aerial ${v}。` : '',
    tvHead: '在电视上', tvBody: '1.32 起，控制中心里出现「有新版本」时，点「下载并安装」，再在系统的安装界面里确认就行。电视不让 App 安装应用时，用下面的方法。',
    pcHead: '在电脑上', pcBody: '电脑和电视连同一个网络，在 macOS 或 Linux 的终端里运行（和第一次安装是同一条命令）：',
    pcNote: 'TCL 电视上会弹出多屏互动的提示，选「同意」。Windows 请交给上面的 Agent。',
    aiHead: '交给 Agent（最省事）', aiBody: '复制下面这段，发给能在电脑上运行命令的 Agent，比如：',
    agents: [['workbuddy', 'WorkBuddy'], ['doubao', '豆包电脑版'], ['qwen', '千问电脑版'], ['trae', 'Trae'], ['claude-code', 'Claude Code'], ['codex', 'Codex']],
    ai: tv =>
`请帮我把电视上的开源桌面 Aerial 升级到最新版。
电视 IP：${tv}

安装说明在这里：https://aerial.qust.me/agent.md
（打不开时用 https://raw.githubusercontent.com/pengchujin/aerial-tv/main/site/agent.md ）

升级就是把安装再做一遍。请先完整读完安装说明再动手，然后在我的电脑上亲自运行命令，不要只把步骤告诉我。需要我在电视上操作时提醒我。
最后按说明里的「验收」，把那几条命令的原始输出贴给我。`,
    keeps: 'App、排列顺序、壁纸和设置都会保留。', notes: '这次更新了什么 ›',
    copy: '复制', copied: '已复制',
    // From the TV's setup page (#setup=1): Aerial is on the TV but nothing has made it Home yet.
    setup: {
      title: '让 Aerial 接管主屏幕',
      sub: () => '只装了 APK 时，Aerial 能打开，但按主页键、开机和待机后还是原来的桌面。下面任选一种，把剩下的设置做完。',
      tvHead: '在电视上', tvBody: '电视的设置里有「无障碍」时，打开其中的「Aerial 桌面守护」，主页键就会回到 Aerial。小米电视待机后会把它关掉，所以还是建议用电脑做一次。',
      ai: tv =>
`请帮我把电视上已经装好的开源桌面 Aerial 设为开机进入的桌面。
电视 IP：${tv}
保持 ADB 常开：要

安装说明在这里：https://aerial.qust.me/agent.md
（打不开时用 https://raw.githubusercontent.com/pengchujin/aerial-tv/main/site/agent.md ）

请先完整读完安装说明再动手，然后在我的电脑上亲自运行命令，不要只把步骤告诉我。需要我在电视上操作时提醒我。
最后按说明里的「验收」，把那几条命令的原始输出贴给我。`,
      keeps: '已经装好的 Aerial 会被同一版本覆盖，App、排列顺序、壁纸和设置都会保留。', notes: '',
    },
  },
  en: {
    title: 'Update Aerial', lang: '中文',
    sub: v => v ? `This TV has Aerial ${v}.` : '',
    tvHead: 'On the TV', tvBody: 'From 1.32, when Control Center shows New Version, choose Download and Install, then confirm in the system installer. If the TV does not let apps install apps, use one of the ways below.',
    pcHead: 'On a computer', pcBody: 'On a computer on the same network as the TV, run this in a macOS or Linux terminal (the same command as the first install):',
    pcNote: 'TCL TVs show a 多屏互动 prompt: choose 同意 (Agree). On Windows, hand it to an agent above.',
    aiHead: 'Hand it to an agent (easiest)', aiBody: 'Copy this and give it to an agent that can run commands on your computer, such as:',
    agents: [['claude-code', 'Claude Code'], ['codex', 'Codex'], ['cursor', 'Cursor'], ['workbuddy', 'WorkBuddy'], ['trae', 'Trae']],
    ai: tv =>
`Please update Aerial, the open-source home screen on my TV, to the latest version.
TV IP: ${tv}

The install guide is here: https://aerial.qust.me/en/agent.md
(If it does not open: https://raw.githubusercontent.com/pengchujin/aerial-tv/main/site/en/agent.md )

Updating is installing again. Read the whole guide before you start, then run the commands on my computer yourself rather than telling me the steps. Tell me when I need to do something on the TV.
Finally, follow the guide's Check step and paste me the raw output of those commands.`,
    keeps: 'Your apps, layout, wallpaper and settings stay as they are.', notes: 'What is new ›',
    copy: 'Copy', copied: 'Copied',
    setup: {
      title: 'Make Aerial your Home screen',
      sub: () => 'Installed from the APK alone, Aerial opens, but Home, power-on and wake still land on the old launcher. Either way below finishes the setup.',
      tvHead: 'On the TV', tvBody: 'If the TV\'s settings have Accessibility, turn on Aerial Home Guard there and Home comes back to Aerial. Xiaomi TVs turn it off in standby, so a computer is still the better way.',
      ai: tv =>
`Please make Aerial, the open-source home screen already installed on my TV, the screen the TV starts on.
TV IP: ${tv}
Keep ADB on: yes

The install guide is here: https://aerial.qust.me/en/agent.md
(If it does not open: https://raw.githubusercontent.com/pengchujin/aerial-tv/main/site/en/agent.md )

Read the whole guide before you start, then run the commands on my computer yourself rather than telling me the steps. Tell me when I need to do something on the TV.
Finally, follow the guide's Check step and paste me the raw output of those commands.`,
      keeps: 'The Aerial already on the TV is installed over; your apps, layout, wallpaper and settings stay.', notes: '',
    },
  },
};
const hash = new URLSearchParams(location.hash.slice(1));
const ip = /^[0-9.]{7,15}$/.test(hash.get('tv') || '') ? hash.get('tv') : '<TV-IP>';
const guard = hash.get('f') === 'guard' ? ' -s guard' : '';
const version = /^[0-9.]+$/.test(hash.get('v') || '') ? hash.get('v') : '';
const setup = hash.get('setup') === '1';
let lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';

function render() {
  const t = setup ? { ...T[lang], ...T[lang].setup } : T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t.title;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t[e.dataset.t]; });
  $('#lang').textContent = t.lang;
  $('#sub').textContent = t.sub(version);
  $('#cmd').textContent = `curl -fsSL https://aerial.qust.me/install.sh | KEEP_ADB=1 TV=${ip} bash${guard}`;
  $('#ai').textContent = t.ai(ip);
  $('#agents').replaceChildren(...t.agents.map(([icon, name]) => {
    const li = document.createElement('li');
    const img = document.createElement('img'); img.src = `../img/agents/${icon}.svg`; img.alt = ''; img.width = 18; img.height = 18;
    li.append(img, name); return li;
  }));
}
function $(s) { return document.querySelector(s); }
$('#lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; render(); };
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  const text = document.getElementById(b.dataset.copy).textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const r = document.createRange(); r.selectNodeContents(document.getElementById(b.dataset.copy));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try { document.execCommand('copy'); } catch (_) {}
  }
  b.textContent = T[lang].copied; clearTimeout(b.timer); b.timer = setTimeout(() => { b.textContent = T[lang].copy; }, 1600);
}));
render();
</script>
</body>
</html>
